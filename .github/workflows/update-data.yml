name: Update state fishing data

on:
  schedule:
    - cron: '17 13 * * *' # daily, ~6am Pacific
  workflow_dispatch:
  push:
    paths:
      - scripts/update-*-data.mjs
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: California
        continue-on-error: true
        run: |
          mkdir -p data/ca/logs
          node scripts/update-ca-data.mjs 2>&1 | tee data/ca/logs/update-ca-data.log
          exit ${PIPESTATUS[0]}
      - name: Commit changes
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          # Only main keeps data commits. A commit on a PR branch would conflict with main's next run,
          # so a branch run shows what changed here and keeps its data as an artifact instead.
          if [ "$GITHUB_REF_NAME" != main ]; then git diff --cached --stat; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state fishing data"
          for i in 1 2 3; do if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi; sleep 10; done
          echo "push failed"; exit 1
      - name: Keep this branch run's data
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/
          if-no-files-found: ignore
          retention-days: 7
