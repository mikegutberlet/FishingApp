name: Build depth contours

on:
  schedule:
    - cron: '23 11 3 * *' # monthly
  workflow_dispatch:
  push:
    paths:
      - scripts/build-ca-bathymetry.mjs
      - .github/workflows/build-bathymetry.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip
      - name: California
        run: node scripts/build-ca-bathymetry.mjs
      - name: Commit changes
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update depth contours"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
