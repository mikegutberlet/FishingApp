name: Check trip gaps sources
# Prints what the trip-gap lookups (roads, regs booklets, ramp levels, gas/ice/bait) get from their sources, from a
# runner (Claude's sandbox can't reach them). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/check-trip-gaps.mjs
      - .github/workflows/check-trip-gaps.yml
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dev/check-trip-gaps.mjs round2
