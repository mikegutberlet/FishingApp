name: Build regulations, fish advisories and access

on:
  schedule:
    - cron: '23 10 * * 2' # weekly: regulations and fish advisories
    - cron: '47 10 9 * *' # monthly: boat ramps and facilities too
  workflow_dispatch:
  push:
    paths:
      - scripts/build-ca-regs.mjs
      - scripts/build-ca-oehha.mjs
      - scripts/build-ca-access.mjs
      - .github/workflows/build-safety.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # each data step has its own limit below, so a slow source can't stop the commit step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fishing regulations
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p data/ca/logs
          node scripts/build-ca-regs.mjs 2>&1 | tee data/ca/logs/build-ca-regs.log
          exit ${PIPESTATUS[0]}
      - name: Fish consumption advisories
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p data/ca/logs
          node scripts/build-ca-oehha.mjs 2>&1 | tee data/ca/logs/build-ca-oehha.log
          exit ${PIPESTATUS[0]}
      - name: Access and facilities
        if: github.event.schedule != '23 10 * * 2'
        continue-on-error: true
        timeout-minutes: 35 # Overpass retries across mirrors can otherwise run past an hour
        run: |
          mkdir -p data/ca/logs
          node scripts/build-ca-access.mjs 2>&1 | tee data/ca/logs/build-ca-access.log
          exit ${PIPESTATUS[0]}
      - name: Commit changes
        run: |
          for f in data/ca/regs.json data/ca/counties.json data/ca/oehha.json data/ca/access.json data/ca/logs; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update regulations, fish advisories and access"
          # If the branch moved under us (another run, a rebase), this run's fresh output wins.
          for i in 1 2 3; do if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          echo "push failed"; exit 1
