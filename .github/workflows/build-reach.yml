name: Build drive-up or hike-in
# How far the nearest road is from each lake and stocked water, for the "Drive-up or hike-in" filter and the line on
# a water's card. Downloads each state's OpenStreetMap extract from Geofabrik, cuts the roads and lake shorelines out with
# osmium, and measures them against data/<st>/lakes.json and waters.json (access.json adds the boat ramps).

on:
  schedule:
    - cron: '47 11 11 * *' # monthly, two days after the access build it reads
  workflow_dispatch:
  push:
    paths:
      - scripts/build-reach.mjs
      - scripts/reach-roads.sh
      - .github/workflows/build-reach.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          # On main, the branch as it is when the job starts, not the commit that queued the run: a run that waited
          # behind another run of this workflow then builds on that run's data commit instead of conflicting with it.
          # Branch runs keep their own commit, since they only upload their data and the branch may be gone by then.
          ref: ${{ github.ref_name == 'main' && github.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Roads from OpenStreetMap
        timeout-minutes: 60
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          for pair in ca:california nv:nevada or:oregon; do
            st=${pair%%:*}; name=${pair##*:}
            # A state whose download or cut fails is left out, and the script keeps that state's old file.
            if curl -fsSL --retry 3 --retry-delay 20 -o "$RUNNER_TEMP/$name.osm.pbf" "https://download.geofabrik.de/north-america/us/$name-latest.osm.pbf" \
              && bash scripts/reach-roads.sh "$RUNNER_TEMP/$name.osm.pbf" "$RUNNER_TEMP/$st-roads.geojsonseq" "$RUNNER_TEMP/$st-water.geojsonseq"; then
              echo "$st: $(wc -l < "$RUNNER_TEMP/$st-roads.geojsonseq") road lines, $(wc -l < "$RUNNER_TEMP/$st-water.geojsonseq") drawn waters, extract $(du -h "$RUNNER_TEMP/$name.osm.pbf" | cut -f1)"
            else
              echo "::warning::$name roads failed"; rm -f "$RUNNER_TEMP/$st-roads.geojsonseq" "$RUNNER_TEMP/$st-water.geojsonseq"
            fi
            rm -f "$RUNNER_TEMP/$name.osm.pbf"
          done
      - name: Drive-up or hike-in
        continue-on-error: true # a state that failed keeps its old file; the others are still committed
        timeout-minutes: 30
        run: |
          args=()
          for st in ca nv or; do if [ -s "$RUNNER_TEMP/$st-roads.geojsonseq" ]; then args+=("$st=$RUNNER_TEMP/$st"); fi; done
          mkdir -p data/ca/logs
          node scripts/build-reach.mjs "${args[@]}" 2>&1 | tee data/ca/logs/build-reach.log
          exit ${PIPESTATUS[0]}
      - name: Commit changes
        run: |
          for f in data/ca/reach.json data/ca/logs/build-reach.log data/nv/reach.json data/or/reach.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          # Only main keeps data commits. A commit on a PR branch would conflict with main's next run,
          # so a branch run shows what changed here and keeps its data as an artifact instead.
          if [ "$GITHUB_REF_NAME" != main ]; then git diff --cached --stat; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update drive-up or hike-in for California, Nevada and Oregon"
          # If the branch moved under us (another run, a rebase), this run's fresh output wins.
          for i in 1 2 3; do if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          echo "push failed"; exit 1
      - name: Keep this branch run's data
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/ca/reach.json
            data/nv/reach.json
            data/or/reach.json
          if-no-files-found: ignore
          retention-days: 7
