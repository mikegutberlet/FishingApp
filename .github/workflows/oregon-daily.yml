name: Update Oregon data

on:
  schedule:
    - cron: '47 13 * * *' # daily, ~6am Pacific
  workflow_dispatch:
  push:
    paths:
      - scripts/or/update-or-data.mjs
      - .github/workflows/oregon-daily.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Oregon stocking, reports, lake levels, algae
        continue-on-error: true
        run: |
          mkdir -p data/or/logs
          node scripts/or/update-or-data.mjs 2>&1 | tee data/or/logs/update-or-data.log
          exit ${PIPESTATUS[0]}
      - name: Commit changes
        run: |
          git add data/or/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Oregon data"
          for i in 1 2 3; do if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi; sleep 10; done
          echo "push failed"; exit 1
