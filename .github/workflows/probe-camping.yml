name: Probe camping sources
# Dev probe for the camping work: prints what each candidate source returns from a runner. Writes nothing.
on:
  push:
    paths:
      - scripts/dev/probe-camping.mjs
      - .github/workflows/probe-camping.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dev/probe-camping.mjs
