name: Check camping lookups
# Runs the app's Camping lookup against the live services for a few known waters and prints the result
# (the services can't be reached from Claude's sandbox). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/check-camping.mjs
      - camping.js
      - camping-rules.js
      - .github/workflows/check-camping.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-detect-module scripts/dev/check-camping.mjs
