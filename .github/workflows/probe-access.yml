name: Check access lookups (dev)
on:
  push:
    paths:
      - scripts/dev/check-access.mjs
      - access-lookup.js
      - access-rules.js
      - .github/workflows/probe-access.yml
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-detect-module scripts/dev/check-access.mjs
