name: Check access lookups
# Runs the app's Getting there lookup against the live services for a few known waters and prints the result
# (the services can't be reached from Claude's sandbox). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/check-access.mjs
      - access-lookup.js
      - access-rules.js
      - access-now.js
      - .github/workflows/check-access.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-detect-module scripts/dev/check-access.mjs
