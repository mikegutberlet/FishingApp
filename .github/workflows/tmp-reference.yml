name: tmp fetch reference texts
on:
  push:
    paths: [.github/workflows/tmp-reference.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-ref
          curl -sSL -A "TackleBox-fishing-app" -o fb178.pdf https://escholarship.org/content/qt5rm0h8qg/qt5rm0h8qg.pdf
          ls -la fb178.pdf; file fb178.pdf
          (which pdftotext || sudo apt-get install -y -qq poppler-utils) >/dev/null
          pdftotext -layout fb178.pdf tmp-ref/fish-bulletin-178.txt
          wc -c tmp-ref/fish-bulletin-178.txt
          git add tmp-ref
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "tmp: reference text" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push
