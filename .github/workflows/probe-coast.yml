name: Probe ocean sources
# Prints what the tide, marine forecast, MPA and pier sources answer, for building the ocean features (Claude's
# sandbox can't reach them). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/probe-coast.mjs
      - .github/workflows/probe-coast.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dev/probe-coast.mjs
