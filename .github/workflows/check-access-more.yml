name: Check more access lookups
# Runs scripts/dev/check-access-more.mjs: permits, passes, boat rules, trailheads and parking, fish seen on
# iNaturalist, CORS and every linked agency page, against the live services (the sandbox can't reach them). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/check-access-more.mjs
      - access-more.js
      - .github/workflows/check-access-more.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-detect-module scripts/dev/check-access-more.mjs
