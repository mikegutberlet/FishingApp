name: Nevada probe

on:
  push:
    paths:
      - scripts/nv/probe-nv.mjs
      - .github/workflows/nevada-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p data/nv/logs
          node scripts/nv/probe-nv.mjs 2>&1 | tee data/nv/logs/probe.log
      - name: Commit changes
        run: |
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nevada probe results"
          for i in 1 2 3; do if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi; sleep 10; done
