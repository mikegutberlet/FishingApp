name: Build statewide water list

on:
  schedule:
    - cron: '41 12 * * 1' # weekly, Monday morning
  workflow_dispatch:
  push:
    paths:
      - scripts/build-ca-*.mjs
      - .github/workflows/build-waters.yml

permissions:
  contents: write

concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: California waters
        run: node scripts/build-ca-waters.mjs
      - name: California history
        run: node scripts/build-ca-history.mjs
      - name: Commit changes
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update statewide water list"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
