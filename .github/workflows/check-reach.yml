name: Check drive-up or hike-in
# Runs scripts/dev/check-reach.mjs: the monthly job's questions (scripts/build-state-reach.mjs) for a few well-known
# waters against the live Overpass service (the sandbox can't reach it). Writes nothing.
on:
  push:
    paths:
      - scripts/dev/check-reach.mjs
      - .github/workflows/check-reach.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dev/check-reach.mjs
